services:
  febaalert:
    image: registry.gitlab.com/ubainnovate/cards-txn-switching/alert/ibank/feba-alert:febaalert
    container_name: febaalert
    env_file:
      - stack.env
    ports:
      - "8131:8131"
    depends_on:
      - postgres
    environment:
      - spring.application.name=${SPRING_APPLICATION_NAME}
      - spring.profiles.active=${SPRING_PROFILES_ACTIVE}
      - server.port=${SERVER_PORT}
      # ###### ORACLE DATABASE ######
      - spring.datasource.url=${SPRING_DATASOURCE_URL}
      - spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
      - spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
      # ######## SMTP DATABASE #########
      - UBA_ALERT_FROM_ADDRESS=${UBA_ALERT_FROM_ADDRESS}
      - UBA_ALERT_SMTP_HOST=${UBA_ALERT_SMTP_HOST}
      - UBA_ALERT_SMTP_PORT=${UBA_ALERT_SMTP_PORT}
      - UBA_ALERT_SMTP_SUBJECT=${UBA_ALERT_SMTP_SUBJECT}
      - UBA_ALERT_SMS_SOURCE_ADDRESS=${UBA_ALERT_SMS_SOURCE_ADDRESS}
      - UBA_ALERT_HOST_DRIVER_CLASS_NAME=${UBA_ALERT_HOST_DRIVER_CLASS_NAME}
      - UBA_ALERT_HOST_DRIVER_TYPE=${UBA_ALERT_HOST_DRIVER_TYPE}
      - spring.mail.host=${UBA_ALERT_SMTP_HOST}
      - spring.mail.port=${UBA_ALERT_SMTP_PORT}
      - spring.mail.properties.mail.smtp.auth=false
      # ##### SPRING BOOT TLS #########
      - server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE}
      - server.ssl.key-store=${SERVER_SSL_KEY_STORE}
      - server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
      - server.ssl.enabled=${SERVER_SSL_ENABLED}
      - server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS}
      - CONFIRM_ALERT_NAME=${CONFIRM_ALERT_NAME}
      # ##### POSTGRES DB #######
      - JOBS_DB_URL=${JOBS_DB_URL}
      - JOBS_DB_USER=${JOBS_DB_USER}
      - JOBS_DB_PASSWORD=${JOBS_DB_PASSWORD}
      - EMAIL_JOB_LOOKBACK_MIN=${EMAIL_JOB_LOOKBACK_MIN}
      - EMAIL_JOB_POLL_MS=${EMAIL_JOB_POLL_MS}
      - logging.level.com.ubagroup.febaalert.scheduler.EmailAlertScheduler=DEBUG
      - logging.level.com.ubagroup.febaalert.repository.EmailJobRepository=DEBUG
      - logging.level.org.springframework.scheduling=DEBUG
      - spring.mail.properties.mail.smtp.connectiontimeout=5000
      - spring.mail.properties.mail.smtp.timeout=10000
      - spring.mail.properties.mail.smtp.writetimeout=10000
      - ALERT_RECENT_QUERY=|-
        SELECT
          ADDRESS,
          ALERT_SUBJECT,
          ALERT_MESG,
          ALERT_NAME,
          BANK_ID,
          ORG_ID,
          USER_ID,
          ALERT_SEQ_NUM,
          R_CRE_TIME AS CRE_TS,
          (SYSDATE - R_CRE_TIME) * 86400 AS AGE_SEC
        FROM ececuser.aldt
        WHERE R_CRE_TIME >= SYSDATE - (:lookbackMin / 1440)
        AND CHANNEL_ID = 'CHANNEL2'
        ORDER BY R_CRE_TIME ASC, ALERT_SEQ_NUM ASC
      - EMAIL_JOB_ENQUEUE_SQL=>-
        INSERT INTO email_jobs (source_alert_id, alert_name, address, subject, message)
        VALUES (?, ?, ?, ?, ?)
        ON CONFLICT (source_alert_id) DO NOTHING
      - EMAIL_JOB_CLAIM_SQL=>-
        UPDATE email_jobs
        SET status = 'PROCESSING', updated_at = now()
          WHERE id IN (
          SELECT id FROM email_jobs
          WHERE status IN ('PENDING', 'RETRY') AND next_retry_at <= now()
          ORDER BY id
          LIMIT ?
          FOR UPDATE SKIP LOCKED)
        RETURNING *
      - EMAIL_JOB_MARK_SENT_SQL=>-
        UPDATE email_jobs
        SET status = 'SENT', sent_at = now(), updated_at = now(), last_error = NULL
        WHERE id = ?
      - EMAIL_JOB_MARK_RETRY_SQL=>-
        UPDATE email_jobs
        SET status = 'RETRY', retry_count = ?, last_error = ?, updated_at = now(),
        next_retry_at = now() + (? * interval '1 minute')
        WHERE id = ?
      - EMAIL_JOB_MARK_FAILED_SQL=>-
        UPDATE email_jobs
        SET status = 'FAILED', last_error = ?, updated_at = now()
        WHERE id = ?
      - EMAIL_JOB_RELEASE_STUCK_SQL=>-
        UPDATE email_jobs
        SET status = 'RETRY', updated_at = now()
        WHERE status = 'PROCESSING'
        AND updated_at < now() - (? * interval '1 minute')


    restart: unless-stopped
    networks:
      - card-bridge

  postgres:
    image: postgres:16
    container_name: febaalert-pg-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${JOBS_DB_USER}
      POSTGRES_PASSWORD: ${JOBS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - card-bridge
    entrypoint:
      - sh
      - -c
      - |
        (
          until pg_isready -q -U "$$POSTGRES_USER"; do sleep 2; done
          while true; do
            date
            psql -U "$$POSTGRES_USER" -d postgres -x -c "SELECT * FROM email_jobs ORDER BY created_at DESC LIMIT 5;"
            sleep 60
          done
        ) &
        exec docker-entrypoint.sh "$$@"
      - sh
    command:
      - postgres
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_statement=all
      - -c
      - "log_line_prefix=%t [%p] %u@%d "
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0


volumes:
  pgdata:

networks:
  card-bridge:
    external: true
